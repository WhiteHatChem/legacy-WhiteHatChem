version: '3'
name: 'whc_astro'

services:
  astro:
    build: .
    container_name: whc_astro
    restart: unless_stopped
    networks:
      - app-network

  webserver:
    image: nginx:latest
    ports:
      - 80:80
      - 443:443
    container_name: webserver
    restart: unless-stopped
    volumes:
      - web-root:/var/www/html
      - ./conf:/etc/nginx/conf.d
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - astro
    networks:
      - app-network

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - web-root:/var/www/html
    depends_on:
      - webserver
    command: certonly --webroot --webroot-path=/var/www/html --email contact@whitehatchemistry.com --agree-tos --no-eff-email --staging -d whitehatchemistry.com  -d www.whitehatchemistry.com 

volumes:
  certbot-etc:
  certbot-var:
  web-root:
    driver: local
    driver_opts:
      type: none
      device: .
      o: bind

networks:
  app-network:
    driver: bridge
